# https://taskfile.dev

version: '3'

vars:
  DIR: '{{default "example" .DIR}}'
  MEMORY: '{{default "2G" .MEMORY}}'
  PORT: '{{default "3333" .PORT}}'

tasks:
  default:
    cmds:
      - task: main
      - task: systematik
      - task: tektonik
      - task: erweitert
    
  main:
    desc: Internformat aufbereiten für Online-Katalog
    cmds:
      - |
        # Arbeitsverzeichnis leeren und Konfigurationsdateien kopieren
        rm -r "{{.DIR}}/tmp" 2> /dev/null || true; mkdir -p "{{.DIR}}/tmp"
        cp -r "config" "{{.DIR}}/tmp/"
      - |
        # orcli das script main.sh ausführen lassen
        DIR={{.DIR}} openrefine/orcli run "scripts/main.sh" --memory "{{.MEMORY}}" --port "{{.PORT}}" --quiet
      - |
        # Arbeitsverzeichnis aufräumen und dann in Ausgabeverzeichnis verschieben
        rm -r "{{.DIR}}"/tmp/config 2> /dev/null || true
        rm "{{.DIR}}"/tmp/tmp* 2> /dev/null || true
        rm -r "{{.DIR}}/output" 2> /dev/null || true
        mv "{{.DIR}}/tmp" "{{.DIR}}/output"
    sources:
      - '{{.DIR}}/input/**'
      - scripts/main.sh
      - 'config/main/**/**'
      - 'config/mappings/**'
    generates:
      - '{{.DIR}}/output/**'
    preconditions:
      - sh: test -f openrefine/orcli
        msg: "orcli not found; try task install"
      - sh: test -f openrefine/refine
        msg: "OpenRefine not found; try task install"
      - command -v jq
      - command -v curl
      - command -v java
      - test -d {{.DIR}}

  systematik:
    desc: Systematik (Thematischer Sucheinstieg) für TYPO3-Datenbank
    cmds:
      - |
        # Arbeitsverzeichnis leeren und Konfigurationsdateien kopieren
        rm -r "{{.DIR}}/tmp" 2> /dev/null || true; mkdir -p "{{.DIR}}/tmp"
        cp -r "config" "{{.DIR}}/tmp/"
      - |
        # orcli das script systematik.sh ausführen lassen
        DIR={{.DIR}} openrefine/orcli run "scripts/systematik.sh" --memory "{{.MEMORY}}" --port "{{.PORT}}" --quiet
      - |
        # Ergebnis in Ausgabeverzeichnis verschieben
        mv "{{.DIR}}/tmp/systematik.tsv" "{{.DIR}}/output/systematik.tsv"

  tektonik:
    desc: Tektonik (Bestandsübersicht) für TYPO3-Datenbank
    cmds:
      - |
        # Arbeitsverzeichnis leeren und Konfigurationsdateien kopieren
        rm -r "{{.DIR}}/tmp" 2> /dev/null || true; mkdir -p "{{.DIR}}/tmp"
        cp -r "config" "{{.DIR}}/tmp/"
      - |
        # orcli das script tektonik.sh ausführen lassen
        DIR={{.DIR}} openrefine/orcli run "scripts/tektonik.sh" --memory "{{.MEMORY}}" --port "{{.PORT}}" --quiet
      - |
        # Ergebnis in Ausgabeverzeichnis verschieben
        mv "{{.DIR}}/tmp/tektonik.tsv" "{{.DIR}}/output/tektonik.tsv"

  erweitert:
    desc: Zusatzfelder für Digitalisierung und Bestandslisten in OpenRefine
    cmds:
      - |
        # Arbeitsverzeichnis leeren und Konfigurationsdateien kopieren
        rm -r "{{.DIR}}/tmp" 2> /dev/null || true; mkdir -p "{{.DIR}}/tmp"
        cp -r "config" "{{.DIR}}/tmp/"
      - |
        # orcli das script erweitert.sh ausführen lassen
        DIR={{.DIR}} openrefine/orcli run "scripts/erweitert.sh" --memory "{{.MEMORY}}" --port "{{.PORT}}" --quiet
      - |
        # Ergebnis in Ausgabeverzeichnis verschieben
        mv "{{.DIR}}"/tmp/*-erweitert.csv "{{.DIR}}/output/"

  dev:
    desc: Entwicklungsmodus (interaktiv)
    cmds:
      - |
        # Arbeitsverzeichnis leeren und Konfigurationsdateien kopieren
        rm -r "{{.DIR}}/tmp" 2> /dev/null || true; mkdir -p "{{.DIR}}/tmp"
        cp -r "config" "{{.DIR}}/tmp/"
      - |
        # orcli das script main.sh im interaktiven Modus ausführen lassen
        DIR={{.DIR}} openrefine/orcli run "scripts/main.sh" --memory "{{.MEMORY}}" --port "{{.PORT}}" --interactive
      - |
        # Arbeitsverzeichnis löschen
        rm -r "{{.DIR}}/tmp" 2> /dev/null || true
    preconditions:
      - sh: test -f openrefine/orcli
        msg: "orcli not found; try task install"
      - sh: test -f openrefine/refine
        msg: "OpenRefine not found; try task install"
      - command -v jq
      - command -v curl
      - command -v java
      - test -d {{.DIR}}

  solr:
    desc: Indexierung in Solr testen
    env:
      SOLR_HOST_BIND: 0.0.0.0
    cmds:
      - solr/bin/solr stop &> /dev/null || true
      - |
        # Gemeinsames Configset und zwei Cores anlegen (wie auf dem Server, siehe docs/solr.md)
        rm -r solr/server/solr/configsets/internformat 2> /dev/null || true
        mkdir -p solr/server/solr/configsets/internformat/conf
        cp config/solr/* solr/server/solr/configsets/internformat/conf/
        for core in indexing internformat; do
          rm -r "solr/server/solr/$core" 2> /dev/null || true
          mkdir -p "solr/server/solr/$core"
          printf 'name=%s\nconfigSet=internformat\n' "$core" > "solr/server/solr/$core/core.properties"
        done
      - solr/bin/solr start --user-managed
      - |
        # Warten, bis Solr antwortet (max. 60 Sekunden)
        for i in $(seq 60); do
          curl --silent --fail 'http://localhost:8983/solr/admin/cores?action=STATUS' > /dev/null && break
          sleep 1
        done
      - SOLR=http://localhost:8983/solr OUTPUT="{{.DIR}}/output" scripts/index.sh
      - |
        # Test query auf Solr core internformat
        [ $(curl --silent 'http://localhost:8983/solr/internformat/query?q=*:*&rows=0' -o /dev/stderr -w "%{http_code}") -eq 200 ]
    preconditions:
      - sh: test -f solr/bin/solr
        msg: "Solr not found; try task install_solr"
      - command -v curl
      - command -v perl
      - test -d {{.DIR}}/output

  yaml:
    desc: JSONL zusätzlich in YAML konvertieren
    cmds:
      - |
        # TSV konvertieren in YAML ohne null values
        for f in "{{.DIR}}"/output/*.jsonl; do
            f="${f##*/}"
            f="${f%%.*}"
            yq -p json -o yaml "{{.DIR}}"/output/${f}.jsonl \
            > "{{.DIR}}"/output/${f}.yaml
        done
    sources:
      - '{{.DIR}}/output/*.tsv'
      - Taskfile.yml
    generates:
      - '{{.DIR}}/output/*.yaml'
    preconditions:
      - command -v yq
      - test -d {{.DIR}}/output

  validate:
    desc: Validierung der XML-Dateien
    cmds:
      - python3 scripts/validate_dc_csv.py "{{.DIR}}"/output/oai-dc.csv
      - python3 scripts/validate_mods_csv.py "{{.DIR}}"/output/oai-mods.csv
    preconditions:
      - command -v python3
      - test -d {{.DIR}}/output

  docs:
    desc: Aktualisierung der Statistiken und Feldtypen in docs/internformat.csv
    cmds:
      - python3 scripts/stats.py "{{.DIR}}"/output
      - python3 scripts/schema_to_docs.py
    preconditions:
      - command -v python3
      - test -d {{.DIR}}/output

  install:
    desc: install all requirements into subdirectories
    cmds:
      - task: install_openrefine
      - task: install_orcli
      - task: install_solr

  install_openrefine:
    cmds:
      - mkdir -p openrefine
      - wget --no-verbose -O openrefine.tar.gz https://github.com/OpenRefine/OpenRefine/releases/download/3.10.0/openrefine-linux-3.10.0.tar.gz
      - tar -xzf openrefine.tar.gz -C openrefine --strip 1 && rm openrefine.tar.gz
       
  install_orcli:
    cmds:
      - mkdir -p openrefine
      - wget --no-verbose -O openrefine/orcli https://github.com/opencultureconsulting/orcli/releases/download/v0.6.2/orcli
      - chmod +x openrefine/orcli

  install_solr:
    cmds:
      - mkdir -p solr
      - wget -q --compression=auto --show-progress -O solr.tgz https://www.apache.org/dyn/closer.lua/solr/solr/10.1.0/solr-10.1.0-slim.tgz?action=download
      - tar -xzf solr.tgz -C solr --strip 1 && rm solr.tgz
