# Kernel-Einstellungen für Solr/Lucene. Ablage: /etc/sysctl.d/90-solr.conf, aktivieren mit: sysctl --system
# Swapping des Java-Heaps vermeiden (führt zu langen GC-Pausen)
vm.swappiness = 1
# Lucene liest den Index per mmap; genügend Memory-Mappings für viele Segmente und Cores (Voreinstellung 65530)
vm.max_map_count = 262144
