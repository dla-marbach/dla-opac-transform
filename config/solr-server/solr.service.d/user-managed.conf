# systemd-Drop-in für den von install_solr_service.sh angelegten Dienst solr.service.
# Ablage: /etc/systemd/system/solr.service.d/user-managed.conf
#
# Solr 10 startet ohne Option im SolrCloud-Modus mit eingebettetem ZooKeeper (bin/solr setzt
# SOLR_MODE fest auf "solrcloud", eine Einstellung in solr.in.sh wird überschrieben).
# Für einen einzelnen Server ohne ZooKeeper: Start im Standalone-Modus (user-managed).
[Service]
ExecStart=
ExecStart=/server/service/solr/bin/solr start --user-managed
